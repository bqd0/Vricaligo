<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171b18">
    <title>Stillroom — Simulation Management</title>

    <style>
        :root {
            color-scheme: dark;
            --ink: #e9e4d8;
            --muted: #9b988e;
            --felt: #202923;
            --felt-light: #2b382d;
            --gold: #dfb86c;
            --gold-dark: #9f7d3c;
            --card: #ece5d6;
            --card-ink: #28271f;
            --danger: #c97769;
            --success: #9ebd83;
            --border: #465448;
            --shadow: rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-width: 320px;
            min-height: 100%;
            background: #171b18;
        }

        body {
            color: var(--ink);
            font: 15px/1.45 Georgia, "Times New Roman", serif;
        }

        button {
            min-height: 46px;
            border: 1px solid var(--gold-dark);
            border-radius: 6px;
            padding: 10px 14px;
            background: #263027;
            color: var(--ink);
            font: inherit;
            cursor: pointer;
            touch-action: manipulation;
        }

            button:active {
                transform: translateY(1px);
            }

            button:hover,
            button:focus-visible {
                border-color: var(--gold);
                background: #334335;
                outline: none;
            }

            button.primary {
                background: var(--gold);
                color: #242117;
            }

                button.primary:hover,
                button.primary:focus-visible {
                    background: #efd18d;
                }

            button.danger {
                border-color: #9c554d;
                color: #f0b4a9;
            }

            button:disabled {
                cursor: not-allowed;
                opacity: .45;
            }

        .game {
            display: flex;
            width: 100%;
            min-height: 100dvh;
            flex-direction: column;
            background: radial-gradient(circle at 50% 0, rgba(75, 96, 75, .2), transparent 42rem), #171b18;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 16px 18px 12px;
            border-bottom: 1px solid #42483f;
        }

        .eyebrow,
        .label,
        .tag {
            color: var(--muted);
            font: 11px/1.3 system-ui, sans-serif;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h1,
        h2,
        h3,
        p {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 0;
            font-size: clamp(24px, 5vw, 38px);
            font-weight: 400;
            letter-spacing: .03em;
        }

        h2 {
            margin-bottom: 6px;
            font-size: clamp(23px, 4vw, 32px);
            font-weight: 400;
        }

        h3 {
            margin-bottom: 5px;
            font-size: 18px;
            font-weight: 400;
        }

        .header-status {
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 4px 14px;
            color: var(--muted);
            font: 12px system-ui, sans-serif;
            text-align: right;
        }

            .header-status strong {
                color: var(--gold);
                font-weight: 500;
            }

        .screen {
            display: flex;
            width: min(1180px, 100%);
            flex: 1;
            flex-direction: column;
            gap: 16px;
            margin: 0 auto;
            padding: 18px;
        }

        .scene {
            flex: 1;
            padding: clamp(16px, 3vw, 28px);
            border: 1px solid var(--border);
            border-radius: 9px;
            background: repeating-linear-gradient( 0deg, transparent 0 39px, rgba(210, 220, 190, .018) 40px ), radial-gradient(ellipse at center, rgba(72, 92, 72, .18), transparent 75%), var(--felt);
            box-shadow: inset 0 0 70px rgba(0, 0, 0, .24);
        }

        .scene-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 20px;
        }

            .scene-heading p {
                max-width: 650px;
                margin-bottom: 0;
                color: #b8b8aa;
            }

        .scene-art {
            display: grid;
            min-height: 150px;
            place-items: center;
            margin-bottom: 18px;
            border: 1px solid rgba(223, 184, 108, .22);
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(35, 57, 39, .85), rgba(19, 27, 21, .9)), radial-gradient(circle at 50% 30%, #68775b, transparent 40%);
            color: rgba(239, 209, 141, .75);
            font-size: clamp(52px, 12vw, 90px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

            .grid.three {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

        .panel {
            padding: 15px;
            border: 1px solid rgba(160, 176, 150, .28);
            border-radius: 7px;
            background: rgba(10, 15, 12, .3);
        }

            .panel p:last-child {
                margin-bottom: 0;
            }

        .panel-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

            .panel-header h3 {
                margin-bottom: 0;
            }

        .stat {
            display: grid;
            gap: 5px;
            margin-bottom: 13px;
        }

            .stat:last-child {
                margin-bottom: 0;
            }

        .stat-line {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: var(--muted);
            font: 12px system-ui, sans-serif;
        }

            .stat-line strong {
                color: var(--ink);
                font-weight: 500;
            }

        .meter {
            height: 7px;
            overflow: hidden;
            border-radius: 99px;
            background: #343b33;
        }

            .meter span {
                display: block;
                height: 100%;
                background: var(--gold);
            }

            .meter.health span {
                background: var(--success);
            }

        .item-list,
        .log {
            display: grid;
            gap: 8px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px;
            border-bottom: 1px solid rgba(220, 220, 200, .1);
        }

            .item:last-child {
                border-bottom: 0;
            }

        .item-name {
            display: block;
            color: var(--ink);
        }

        .item-description {
            display: block;
            color: var(--muted);
            font-size: 12px;
        }

        .item-count {
            color: var(--gold);
            font: 700 14px system-ui, sans-serif;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 15px;
        }

            .actions button {
                flex: 1 1 150px;
            }

        .nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 0 18px 18px;
        }

            .nav button {
                min-height: 54px;
                border-color: #465448;
                color: var(--muted);
            }

                .nav button.active {
                    border-color: var(--gold);
                    color: var(--gold);
                }

        .log {
            max-height: 180px;
            overflow-y: auto;
            color: var(--muted);
            font: 12px/1.55 system-ui, sans-serif;
        }

            .log p {
                margin: 0;
                padding-bottom: 7px;
                border-bottom: 1px solid rgba(220, 220, 200, .1);
            }

        .notice {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-left: 3px solid var(--gold);
            background: rgba(223, 184, 108, .08);
            color: #d8c492;
        }

            .notice.error {
                border-left-color: var(--danger);
                color: #e1a79d;
            }

        .empty {
            padding: 20px 0;
            color: var(--muted);
            font-style: italic;
        }

        @media (max-width: 680px) {
            .game-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 9px;
                padding: 13px 10px 11px;
            }

            .header-status {
                width: 100%;
                grid-template-columns: repeat(4, 1fr);
                text-align: left;
            }

            .screen {
                gap: 11px;
                padding: 10px;
            }

            .scene {
                padding: 14px;
            }

            .scene-heading {
                flex-direction: column;
                gap: 8px;
                margin-bottom: 15px;
            }

            .grid,
            .grid.three {
                grid-template-columns: 1fr;
            }

            .nav {
                gap: 5px;
                padding: 0 10px 10px;
            }

                .nav button {
                    min-height: 50px;
                    padding: 7px 4px;
                    font-size: 12px;
                }
        }
    </style>
</head>
<body>
    <main id="game" class="game" aria-live="polite"></main>

    <script>
        "use strict";

        /*
         * DATA
         * Game content belongs here rather than inside the scene renderers.
         */
        const gameData = {
            locations: {
                marsh: {
                    id: "marsh",
                    name: "The Reed Marsh",
                    biome: "Wetland",
                    icon: "♒",
                    description: "A drowned stretch of land where reeds whisper around half-sunken stones.",
                    exits: ["cottage", "old-road"],
                    resources: ["reed-fiber", "marsh-water"],
                    creatures: ["marsh-wisp"]
                },
                cottage: {
                    id: "cottage",
                    name: "The Stillroom Cottage",
                    biome: "Shelter",
                    icon: "⌂",
                    description: "Your small workroom, protected from the marsh by old brick and stubborn ivy.",
                    exits: ["marsh"],
                    resources: [],
                    creatures: []
                },
                "old-road": {
                    id: "old-road",
                    name: "The Old Road",
                    biome: "Ruins",
                    icon: "⌁",
                    description: "A road abandoned by travelers but not by everything that follows them.",
                    exits: ["marsh"],
                    resources: ["rusted-metal"],
                    creatures: ["road-hound"]
                }
            },

            items: {
                "reed-fiber": {
                    name: "Reed Fiber",
                    description: "Strong, pale strands useful for binding.",
                    type: "Material"
                },
                "marsh-water": {
                    name: "Marsh Water",
                    description: "Cloudy water with a faint silver shimmer.",
                    type: "Material"
                },
                "rusted-metal": {
                    name: "Rusted Metal",
                    description: "A corroded fragment from something larger.",
                    type: "Material"
                },
                tonic: {
                    name: "Restorative Tonic",
                    description: "A bitter but effective healing draught.",
                    type: "Consumable"
                }
            },

            npcs: {
                "marsh-wisp": {
                    name: "Marsh Wisp",
                    role: "Wandering Creature",
                    description: "A cold blue light drifting just above the water.",
                    health: 18,
                    attack: 4
                },
                "road-hound": {
                    name: "Road Hound",
                    role: "Hostile Creature",
                    description: "A lean, ash-colored animal with an iron collar.",
                    health: 24,
                    attack: 6
                }
            },

            buildings: {
                cottage: {
                    name: "Stillroom Cottage",
                    description: "A quiet building for storing materials, crafting supplies, and recovering.",
                    services: ["rest", "craft"]
                }
            }
        };

        /*
         * STATE
         * This object contains game state only. It does not contain DOM elements.
         */
        const state = {
            scene: "world",
            locationId: "marsh",
            day: 1,
            hour: 8,
            notice: "",
            noticeType: "",
            log: [
                "You wake before the marsh fog lifts.",
                "The stillroom is ready for another day."
            ],
            player: {
                name: "The Keeper",
                level: 1,
                experience: 0,
                health: 30,
                maxHealth: 30,
                energy: 10,
                maxEnergy: 10,
                insight: 0
            },
            inventory: {
                "reed-fiber": 2,
                "marsh-water": 1,
                tonic: 1
            },
            combat: null
        };

        /*
         * REUSABLE UI COMPONENTS
         */
        const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#039;"
        }[character]));

        const currentLocation = () => gameData.locations[state.locationId];

        const itemCount = itemId => state.inventory[itemId] || 0;

        function itemName(itemId) {
            return gameData.items[itemId]?.name || itemId;
        }

        function addLog(message) {
            state.log.unshift(message);
            state.log = state.log.slice(0, 30);
        }

        function setNotice(message, type = "") {
            state.notice = message;
            state.noticeType = type;
        }

        function advanceTime(hours = 1) {
            state.hour += hours;

            if (state.hour >= 24) {
                state.hour -= 24;
                state.day += 1;
                addLog(`Day ${state.day} begins beneath a different sky.`);
            }
        }

        function formatTime() {
            const hour = state.hour % 12 || 12;
            const suffix = state.hour >= 12 ? "PM" : "AM";
            return `${hour}:00 ${suffix}`;
        }

        function renderNotice() {
            if (!state.notice) {
                return "";
            }

            return `
                    <div class="notice ${state.noticeType}">
                        ${escapeHtml(state.notice)}
                    </div>
                `;
        }

        function renderPlayerPanel() {
            const player = state.player;
            const healthPercent = Math.max(0, player.health / player.maxHealth * 100);
            const energyPercent = Math.max(0, player.energy / player.maxEnergy * 100);

            return `
                    <section class="panel">
                        <div class="panel-header">
                            <h3>${escapeHtml(player.name)}</h3>
                            <span class="tag">Level ${player.level}</span>
                        </div>

                        <div class="stat">
                            <div class="stat-line">
                                <span>Health</span>
                                <strong>${player.health} / ${player.maxHealth}</strong>
                            </div>
                            <div class="meter health">
                                <span style="width: ${healthPercent}%"></span>
                            </div>
                        </div>

                        <div class="stat">
                            <div class="stat-line">
                                <span>Energy</span>
                                <strong>${player.energy} / ${player.maxEnergy}</strong>
                            </div>
                            <div class="meter">
                                <span style="width: ${energyPercent}%"></span>
                            </div>
                        </div>

                        <div class="stat-line">
                            <span>Insight</span>
                            <strong>${player.insight}</strong>
                        </div>
                    </section>
                `;
        }

        function renderInventoryPanel(compact = false) {
            const entries = Object.entries(state.inventory)
                .filter(([, quantity]) => quantity > 0);

            return `
                    <section class="panel">
                        <div class="panel-header">
                            <h3>Inventory</h3>
                            <span class="tag">${entries.length} types</span>
                        </div>

                        <div class="item-list">
                            ${entries.length
                    ? entries.map(([itemId, quantity]) => {
                        const item = gameData.items[itemId];

                        return `
                                            <div class="item">
                                                <div>
                                                    <span class="item-name">${escapeHtml(item.name)}</span>
                                                    ${compact
                                ? ""
                                : `<span class="item-description">${escapeHtml(item.description)}</span>`
                            }
                                                </div>
                                                <span class="item-count">×${quantity}</span>
                                            </div>
                                        `;
                    }).join("")
                    : `<div class="empty">Your inventory is empty.</div>`
                }
                        </div>

                        ${itemCount("tonic") > 0
                    ? `
                                    <div class="actions">
                                        <button data-action="use-tonic">
                                            Use tonic
                                        </button>
                                    </div>
                                `
                    : ""
                }
                    </section>
                `;
        }

        function renderLogPanel() {
            return `
                    <section class="panel">
                        <div class="panel-header">
                            <h3>Field Notes</h3>
                            <span class="tag">Day ${state.day}</span>
                        </div>

                        <div class="log">
                            ${state.log.map(entry => `<p>${escapeHtml(entry)}</p>`).join("")}
                        </div>
                    </section>
                `;
        }

        function renderLocationPanel() {
            const location = currentLocation();

            return `
                    <section class="panel">
                        <div class="panel-header">
                            <h3>${escapeHtml(location.name)}</h3>
                            <span class="tag">${escapeHtml(location.biome)}</span>
                        </div>

                        <p>${escapeHtml(location.description)}</p>

                        <div class="actions">
                            ${location.exits.map(exitId => {
                const exit = gameData.locations[exitId];

                return `
                                    <button data-action="travel" data-location="${escapeHtml(exitId)}">
                                        Travel to ${escapeHtml(exit.name)}
                                    </button>
                                `;
            }).join("")}
                        </div>
                    </section>
                `;
        }

        /*
         * SCENE MODULES
         * Each scene reads state and returns UI. Scenes do not own game data.
         */
        const scenes = {
            world: {
                label: "Location",
                render() {
                    const location = currentLocation();

                    return `
                            <section class="scene">
                                ${renderNotice()}

                                <div class="scene-heading">
                                    <div>
                                        <div class="eyebrow">${escapeHtml(location.biome)} biome</div>
                                        <h2>${escapeHtml(location.name)}</h2>
                                        <p>${escapeHtml(location.description)}</p>
                                    </div>
                                </div>

                                <div class="scene-art" aria-hidden="true">
                                    ${location.icon}
                                </div>

                                <div class="grid">
                                    ${renderLocationPanel()}
                                    ${renderPlayerPanel()}
                                </div>

                                <div class="grid">
                                    <section class="panel">
                                        <div class="panel-header">
                                            <h3>Local Activity</h3>
                                            <span class="tag">${formatTime()}</span>
                                        </div>

                                        <p>
                                            ${location.resources.length
                            ? "The area contains resources that may be gathered."
                            : "The area is quiet and offers shelter from the weather."
                        }
                                        </p>

                                        <div class="actions">
                                            ${location.resources.length
                            ? `<button class="primary" data-action="gather">Gather resources</button>`
                            : `<button class="primary" data-action="enter-building">Enter cottage</button>`
                        }

                                            ${location.creatures.length
                            ? `<button class="danger" data-action="encounter">Investigate creature</button>`
                            : ""
                        }
                                        </div>
                                    </section>

                                    ${renderInventoryPanel(true)}
                                </div>

                                ${renderLogPanel()}
                            </section>
                        `;
                }
            },

            inventory: {
                label: "Inventory",
                render() {
                    return `
                            <section class="scene">
                                ${renderNotice()}

                                <div class="scene-heading">
                                    <div>
                                        <div class="eyebrow">Storage and supplies</div>
                                        <h2>Inventory</h2>
                                        <p>Materials and useful objects carried by the Keeper.</p>
                                    </div>
                                </div>

                                <div class="grid">
                                    ${renderInventoryPanel()}
                                    ${renderPlayerPanel()}
                                </div>

                                ${renderLogPanel()}
                            </section>
                        `;
                }
            },

            cottage: {
                label: "Building",
                render() {
                    const building = gameData.buildings.cottage;

                    return `
                            <section class="scene">
                                ${renderNotice()}

                                <div class="scene-heading">
                                    <div>
                                        <div class="eyebrow">Building</div>
                                        <h2>${escapeHtml(building.name)}</h2>
                                        <p>${escapeHtml(building.description)}</p>
                                    </div>
                                </div>

                                <div class="scene-art" aria-hidden="true">⌂</div>

                                <div class="grid three">
                                    <section class="panel">
                                        <h3>Rest</h3>
                                        <p>Recover health and energy until the next morning.</p>
                                        <button class="primary" data-action="rest">Rest</button>
                                    </section>

                                    <section class="panel">
                                        <h3>Workbench</h3>
                                        <p>Turn gathered materials into a restorative tonic.</p>
                                        <button
                                            data-action="craft-tonic"
                                            ${itemCount("reed-fiber") < 2 || itemCount("marsh-water") < 1 ? "disabled" : ""}
                                        >
                                            Craft tonic
                                        </button>
                                    </section>

                                    <section class="panel">
                                        <h3>Leave</h3>
                                        <p>Return to the nearest outdoor location.</p>
                                        <button data-action="travel" data-location="marsh">
                                            Return to marsh
                                        </button>
                                    </section>
                                </div>

                                <div class="grid">
                                    ${renderInventoryPanel(true)}
                                    ${renderPlayerPanel()}
                                </div>

                                ${renderLogPanel()}
                            </section>
                        `;
                }
            },

            combat: {
                label: "Combat",
                render() {
                    const combat = state.combat;
                    const creature = gameData.npcs[combat.creatureId];
                    const healthPercent = Math.max(0, combat.health / creature.health * 100);

                    return `
                            <section class="scene">
                                ${renderNotice()}

                                <div class="scene-heading">
                                    <div>
                                        <div class="eyebrow">${escapeHtml(creature.role)}</div>
                                        <h2>${escapeHtml(creature.name)}</h2>
                                        <p>${escapeHtml(creature.description)}</p>
                                    </div>
                                </div>

                                <div class="scene-art" aria-hidden="true">☽</div>

                                <div class="grid">
                                    <section class="panel">
                                        <div class="panel-header">
                                            <h3>${escapeHtml(creature.name)}</h3>
                                            <span class="tag">Enemy</span>
                                        </div>

                                        <div class="stat">
                                            <div class="stat-line">
                                                <span>Health</span>
                                                <strong>${combat.health} / ${creature.health}</strong>
                                            </div>
                                            <div class="meter">
                                                <span style="width: ${healthPercent}%"></span>
                                            </div>
                                        </div>

                                        <div class="actions">
                                            <button class="primary" data-action="attack">Attack</button>
                                            <button data-action="use-tonic">Use tonic</button>
                                            <button class="danger" data-action="flee">Flee</button>
                                        </div>
                                    </section>

                                    ${renderPlayerPanel()}
                                </div>

                                ${renderLogPanel()}
                            </section>
                        `;
                }
            }
        };

        /*
         * APPLICATION SHELL
         */
        function renderShell() {
            const scene = scenes[state.scene];

            document.querySelector("#game").innerHTML = `
                    <header class="game-header">
                        <div>
                            <div class="eyebrow">A mobile simulation management game</div>
                            <h1>The Stillroom</h1>
                        </div>

                        <div class="header-status">
                            <span>Day</span>
                            <strong>${state.day}</strong>
                            <span>Time</span>
                            <strong>${formatTime()}</strong>
                            <span>Scene</span>
                            <strong>${escapeHtml(scene.label)}</strong>
                        </div>
                    </header>

                    <div class="screen">
                        ${scene.render()}
                    </div>

                    <nav class="nav" aria-label="Game navigation">
                        <button class="${state.scene === "world" ? "active" : ""}" data-action="scene" data-scene="world">
                            World
                        </button>
                        <button class="${state.scene === "inventory" ? "active" : ""}" data-action="scene" data-scene="inventory">
                            Inventory
                        </button>
                        <button class="${state.scene === "cottage" ? "active" : ""}" data-action="scene" data-scene="cottage">
                            Cottage
                        </button>
                        <button data-action="new-day">
                            New day
                        </button>
                    </nav>
                `;
        }

        function changeScene(sceneName) {
            if (!scenes[sceneName]) {
                return;
            }

            state.scene = sceneName;
            setNotice("");
            renderShell();
        }

        function travel(locationId) {
            if (!gameData.locations[locationId]) {
                return;
            }

            state.locationId = locationId;
            state.combat = null;
            state.scene = locationId === "cottage" ? "cottage" : "world";
            advanceTime(1);
            addLog(`You travel to ${gameData.locations[locationId].name}.`);
            setNotice("");
            renderShell();
        }

        function gather() {
            const location = currentLocation();

            if (!location.resources.length) {
                setNotice("There is nothing useful to gather here.", "error");
                renderShell();
                return;
            }

            const resourceId = location.resources[
                Math.floor(Math.random() * location.resources.length)
            ];

            state.inventory[resourceId] = itemCount(resourceId) + 1;
            state.player.energy = Math.max(0, state.player.energy - 1);
            state.player.experience += 2;
            advanceTime(1);

            addLog(`You gather 1 ${itemName(resourceId)}.`);
            setNotice(`${itemName(resourceId)} added to your inventory.`);
            renderShell();
        }

        function beginEncounter() {
            const location = currentLocation();

            if (!location.creatures.length) {
                return;
            }

            const creatureId = location.creatures[
                Math.floor(Math.random() * location.creatures.length)
            ];

            state.combat = {
                creatureId,
                health: gameData.npcs[creatureId].health
            };
            state.scene = "combat";
            setNotice("");
            addLog(`A ${gameData.npcs[creatureId].name.toLowerCase()} blocks your path.`);
            renderShell();
        }

        function attack() {
            if (!state.combat) {
                return;
            }

            const creature = gameData.npcs[state.combat.creatureId];
            const playerDamage = 5 + Math.floor(Math.random() * 4);
            const enemyDamage = creature.attack;

            state.combat.health -= playerDamage;

            if (state.combat.health <= 0) {
                state.player.experience += 8;
                state.player.insight += 1;
                state.combat = null;
                state.scene = "world";
                addLog(`You defeat the ${creature.name.toLowerCase()}.`);
                setNotice("The encounter reveals a little more about this place.");
                renderShell();
                return;
            }

            state.player.health = Math.max(0, state.player.health - enemyDamage);
            addLog(`You strike for ${playerDamage}. The creature answers for ${enemyDamage}.`);

            if (state.player.health <= 0) {
                state.player.health = 1;
                state.combat = null;
                state.scene = "cottage";
                addLog("You retreat to the cottage before the marsh can take you.");
                setNotice("You barely escaped. Rest before returning.", "error");
            }

            renderShell();
        }

        function useTonic() {
            if (itemCount("tonic") <= 0) {
                setNotice("You have no tonic.", "error");
                renderShell();
                return;
            }

            state.inventory.tonic -= 1;
            state.player.health = Math.min(
                state.player.maxHealth,
                state.player.health + 12
            );
            addLog("You drink a restorative tonic.");
            setNotice("Your health improves.");
            renderShell();
        }

        function rest() {
            state.player.health = state.player.maxHealth;
            state.player.energy = state.player.maxEnergy;
            state.day += 1;
            state.hour = 7;
            addLog("You rest until morning. The stillroom feels warmer.");
            setNotice("Health and energy restored.");
            renderShell();
        }

        function craftTonic() {
            if (itemCount("reed-fiber") < 2 || itemCount("marsh-water") < 1) {
                setNotice("You need 2 Reed Fiber and 1 Marsh Water.", "error");
                renderShell();
                return;
            }

            state.inventory["reed-fiber"] -= 2;
            state.inventory["marsh-water"] -= 1;
            state.inventory.tonic = itemCount("tonic") + 1;
            state.player.experience += 4;
            advanceTime(1);

            addLog("You craft a restorative tonic at the workbench.");
            setNotice("Restorative tonic added to your inventory.");
            renderShell();
        }

        function newDay() {
            state.day += 1;
            state.hour = 7;
            state.player.energy = state.player.maxEnergy;
            addLog(`Day ${state.day} begins.`);
            setNotice("A new day begins.");
            renderShell();
        }

        function handleAction(event) {
            const button = event.target.closest("[data-action]");

            if (!button) {
                return;
            }

            const action = button.dataset.action;

            switch (action) {
                case "scene":
                    changeScene(button.dataset.scene);
                    break;
                case "travel":
                    travel(button.dataset.location);
                    break;
                case "gather":
                    gather();
                    break;
                case "encounter":
                    beginEncounter();
                    break;
                case "attack":
                    attack();
                    break;
                case "flee":
                    state.combat = null;
                    state.scene = "world";
                    addLog("You leave the encounter behind.");
                    setNotice("You retreat to safer ground.");
                    renderShell();
                    break;
                case "use-tonic":
                    useTonic();
                    break;
                case "rest":
                    rest();
                    break;
                case "craft-tonic":
                    craftTonic();
                    break;
                case "enter-building":
                    changeScene("cottage");
                    break;
                case "new-day":
                    newDay();
                    break;
                default:
                    break;
            }
        }

        document.addEventListener("click", handleAction);

        renderShell();
    </script>
</body>
</html>
